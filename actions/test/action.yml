name: "ESP Firmware Test Action"
description: "Run test on a test station"

inputs:
  teststation-broker:
    description: "IP:Port of MQTT broker where test station listens to"
    required: true
  teststation-master-topic:
    description: "teststation request is published to <master-topic>/request"
    required: false
    default: "teststation"
  teststation-request-timeout:
    description: "Time in seconds to wait for teststation to become available"
    required: false
    default: "3600"
  access-token:
    description: "Personal access token for private repos"
    required: true
  tailscale-key:
    description: "a reusable tailscale key"
    required: true
  artifact-name:
    description: "artifact name to download fwpkg"
    required: true
  requester-version:
    description: "tag of requester to use"
    required: false
    default: "v4.4.0"
  request-timeout:
    description: "Time in seconds to wait for teststation to become available"
    required: false
    default: "3600"
    
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: "recursive"
        token: ${{ inputs.access-token }}

    - name: Start esp-idf Devcontainer
      uses: ci4rail/fw_esp-action/actions/setup_devcontainer@v12

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: in/

    - name: Generate test bundle
      # Generates pytest-bundle.zip
      shell: bash
      run: |
        mapfile -t downloaded_artifacts < <(find in -type f -printf '%P\n')
        shopt -s dotglob nullglob
        ls -lR in
        for artifact_path in in/*; do
          if [[ -d "$artifact_path" ]]; then
            artifact_dir=${artifact_path#in/}
            mkdir -p "$artifact_dir"
            mv -- "$artifact_path"/* "$artifact_dir"/
          else
            mv -- "$artifact_path" .
          fi
        done
        ${{ github.action_path }}/../run_in_devcontainer/run.sh ${{ github.run_id }} "make pytest-bundle"

        for artifact in "${downloaded_artifacts[@]}"; do
          if ! unzip -Z1 pytest-bundle.zip | grep -Fxq "$artifact"; then
            echo "Downloaded artifact is missing from pytest-bundle.zip: $artifact" >&2
            exit 1
          fi
        done

    - name: Upload test bundle
      id: upload_test_bundle
      uses: actions/upload-artifact@v4
      with:
        name: test-bundle
        path: pytest-bundle.zip

    # Add action's path so that scripts can be found
    - run: echo "${{ github.action_path }}" >> $GITHUB_PATH
      shell: bash
    - name: Select requester architecture
      id: requester_arch
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64 | amd64) echo "asset_arch=amd64" >> "$GITHUB_OUTPUT" ;;
          aarch64 | arm64) echo "asset_arch=arm64" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "Unsupported requester architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
    - name: fetch requester
      uses: dsaltares/fetch-gh-release-asset@master
      with:
        repo: "ci4rail/test-scheduler"
        version: "tags/${{ inputs.requester-version }}"
        file: "test-requester-${{ inputs.requester-version }}-linux-${{ steps.requester_arch.outputs.asset_arch }}.tar.gz"
        token: ${{ inputs.access-token }}
    - name: Tailscale
      uses: tailscale/github-action@v1
      with:
        authkey: ${{ inputs.tailscale-key }}
    - name: Run Test
      id: run_test
      shell: bash
      run: |
        generate_request.py "${{ github.run_id }}" "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ steps.upload_test_bundle.outputs.artifact-id }}" "test-bundle" "${{ github.sha }}" > request.json
        cat request.json
        tar xzf test-requester-${{ inputs.requester-version }}-linux-${{ steps.requester_arch.outputs.asset_arch }}.tar.gz
        chmod +x test-requester && mv test-requester "${{ github.action_path }}"

        timeout_sec=${{ inputs.request-timeout }}
        set +e
        set -o pipefail

        test-requester -busytimeout ${timeout_sec} "${{ inputs.teststation-broker }}" "${{ inputs.teststation-master-topic }}" request.json | tee output.txt; rc=$?;
        set -e
        if [[ $rc == 1 ]]; then
          echo "ERROR Test Failed"
        elif [[ $rc == 2 ]]; then
          echo "ERROR Test Station Busy"
        elif [[ $rc == 3 ]]; then
          echo "ERROR Request Invalid"
        else
          echo "Test PASS"
        fi
        echo "EXIT_CODE=$rc" >> $GITHUB_ENV
        exit $rc

    - name: tear down devcontainer
      if: ${{ always() }}
      uses: ci4rail/fw_esp-action/actions/teardown_devcontainer@v12
