name: ESP32 Secure App Workflow

on:
  workflow_call:
    inputs:
      firmware_signing_azure_subscription_id:
        required: true
        type: string
      firmware_signing_azure_tenant_id:
        required: true
        type: string
      build-dfu:
        description: "Whether to build dfu binary"
        required: false
        type: boolean
        default: false
      build-appv2:
        description: "Whether to build appv2"
        required: false
        type: boolean
        default: false
      teststation-broker:
        description: "IP:Port of MQTT broker where test station listens to"
        type: string
        required: true
      teststation-master-topic:
        description: "teststation request is published to <master-topic>/request"
        required: false
        type: string
        default: "teststation"
      teststation-request-timeout:
        description: "Time in seconds to wait for teststation to become available"
        required: false
        type: number
        default: 3600
      test-environment:
        description: "Newline-delimited KEY=VALUE entries to include in the test bundle"
        required: false
        type: string
        default: ""
      target-commitish:
        description: "The commitish value that determines where the Git tag is created from. Can be any branch or commit SHA. Default: the repository's default branch (usually main)."
        type: string
        required: false
        default: ""
      bootloader-repo:
        description: "Repository where to get bootloader from"
        type: string
        required: true
      bootloader-release-tag:
        description: "Release tag for the bootloader"
        type: string
        required: true
      public-release-repo:
        description: "Public release repository. (don't publish if empty)"
        type: string
        required: false
        default: ""
      license-contact:
        description: "License contact email"
        type: string
        required: true
      company:
        description: "Company name"
        type: string
        required: true
      publish-sbom:
        description: |
          Build a CycloneDX SBOM (on every run) and publish it to Dependency-Track (on tags only).
          Needs the repo/org variable DEPENDENCY_TRACK_URL and the secret dependency-track-api-key.
        type: boolean
        required: false
        default: false
      dependency-track-classifier:
        description: "Dependency-Track project classifier"
        type: string
        required: false
        default: "FIRMWARE"

    secrets:
      access-token:
        description: "Personal access token for private repos"
        required: true
      dependency-track-api-key:
        description: "Dependency-Track API key, required if publish-sbom is true"
        required: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    outputs:
      project-name: ${{ steps.build_app.outputs.project-name }}
      version: ${{ steps.build_app.outputs.version }}
      app-file: ${{ steps.build_app.outputs.app-file }}
      appv2-file: ${{ steps.build_appv2.outputs.app-file }}
      chip: ${{ steps.build_app.outputs.chip }}
      licensing-info: ${{ steps.licensing.outputs.licensing-info-file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.access-token }}

      - name: Unshallow submodules and force-refresh tags
        shell: bash
        run: |
          git submodule foreach --recursive '
            # Unshallow if the submodule was fetched shallow
            if git rev-parse --is-shallow-repository | grep -q true; then
              git fetch --unshallow origin
            fi
            # Force-update tags to pick up rewritten (lightweight → annotated) tags
            git fetch origin --tags --force --prune
          '
      - name: Start esp-idf Devcontainer
        uses: ci4rail/fw_esp-action/actions/setup_devcontainer@v13

      - name: Build App
        id: build_app
        uses: ci4rail/fw_esp-action/actions/build_app@v13
        with:
          app-build-command: make build-secure
          build-dfu: ${{ inputs.build-dfu }}
          build-dir: build-secure

      - name: Build CycloneDX SBOM
        if: ${{ inputs.publish-sbom == true }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u "$(id -u):$(id -g)" "esp-devc-${{ github.run_id }}" bash -c '
            set -euo pipefail
            source /opt/esp/idf/export.sh
            esp-idf-sbom --version
            esp-idf-sbom create \
              --format cyclonedx-json \
              --rem-unused \
              --rem-submodules \
              --rem-config \
              --file-tags \
              --output-file sbom.cdx.json \
              ${{ steps.build_app.outputs.build-dir }}/project_description.json
          '
          test -s sbom.cdx.json
          python3 -c 'import json; json.load(open("sbom.cdx.json", encoding="utf-8"))'

      - name: Build Appv2
        if: ${{ inputs.build-appv2 == true }}
        id: build_appv2
        uses: ci4rail/fw_esp-action/actions/build_app@v13
        with:
          app-build-command: make build-secure-appv2
          build-dir: build-secure_appv2

      - name: Generate Licensing Info
        uses: ci4rail/fw_esp-action/actions/licensing@v13
        id: licensing
        with:
          build-dir: ${{ steps.build_app.outputs.build-dir }}
          project-name: ${{ steps.build_app.outputs.project-name }}
          version: ${{ steps.build_app.outputs.version }}
          license-contact: ${{ inputs.license-contact }}
          company: ${{ inputs.company }}

      - name: Stage build outputs
        shell: bash
        run: |
          stage_build() {
            local build_dir="$1"
            local app_file="$2"
            local stage_dir="artifact/$build_dir"

            mkdir -p "$stage_dir/partition_table"
            cp -- "$build_dir/$app_file" "$stage_dir/"
            cp -- "$build_dir/project_description.json" "$stage_dir/"
            cp -- "$build_dir/partition_table/partition-table.bin" "$stage_dir/partition_table/"
            cp -- "$build_dir/ota_data_initial.bin" "$stage_dir/"
            cp -- "$build_dir/flash_bootloader_args" "$stage_dir/"
            cp -- "$build_dir/flash_project_args" "$stage_dir/"
          }

          stage_build "${{ steps.build_app.outputs.build-dir }}" "${{ steps.build_app.outputs.app-file }}"

          appv2_file="${{ steps.build_appv2.outputs.app-file }}"
          if [[ -n "$appv2_file" ]]; then
            stage_build "${{ steps.build_appv2.outputs.build-dir }}" "$appv2_file"
          fi

          cp -- "${{ steps.licensing.outputs.licensing-info-path }}" artifact/

          if [[ -f sbom.cdx.json ]]; then
            cp -- sbom.cdx.json artifact/
          fi

      - name: Upload build outputs to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: build_output
          path: artifact/

      - name: tear down devcontainer
        if: ${{ always() }}
        uses: ci4rail/fw_esp-action/actions/teardown_devcontainer@v13

  sign:
    needs: build
    permissions:
      id-token: write # required for OIDC
      contents: read
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        env:
          - name: staging
          - name: production
    environment: ${{ matrix.env.name }}
    steps:
      # we need to checkout repo, as we need devcontainer.json
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start esp-idf Devcontainer
        uses: ci4rail/fw_esp-action/actions/setup_devcontainer@v13

      - uses: actions/download-artifact@v4
        with:
          name: build_output
          path: in/

      - name: List Files
        run: |
          ls -l in/

      - name: Generate signature
        id: gen_signature
        uses: ci4rail/fw_esp-action/actions/azure_key_vault_sign@v13
        with:
          binary: in/build-secure/${{ needs.build.outputs.app-file }}
          azure_subscription_id: ${{ inputs.firmware_signing_azure_subscription_id }}
          azure_tenant_id: ${{ inputs.firmware_signing_azure_tenant_id }}
          azure_app_id: ${{ vars.FIRMWARE_SIGNING_AZURE_APP_ID }}
          key_ids: ${{ vars.FIRMWARE_SIGNING_AZURE_KEY_ID }}

      - name: Sign image with espsecure
        id: sign
        uses: ci4rail/fw_esp-action/actions/esp_sign@v13
        with:
          binary: in/build-secure/${{ needs.build.outputs.app-file }}

      - name: Generate appv2 signature
        if: ${{ inputs.build-appv2 == true && matrix.env.name == 'staging' }}
        id: gen_signature_appv2
        uses: ci4rail/fw_esp-action/actions/azure_key_vault_sign@v13
        with:
          binary: in/build-secure_appv2/${{ needs.build.outputs.appv2-file }}
          azure_subscription_id: ${{ inputs.firmware_signing_azure_subscription_id }}
          azure_tenant_id: ${{ inputs.firmware_signing_azure_tenant_id }}
          azure_app_id: ${{ vars.FIRMWARE_SIGNING_AZURE_APP_ID }}
          key_ids: ${{ vars.FIRMWARE_SIGNING_AZURE_KEY_ID }}

      - name: Sign appv2 image with espsecure
        if: ${{ inputs.build-appv2 == true && matrix.env.name == 'staging' }}
        id: sign_appv2
        uses: ci4rail/fw_esp-action/actions/esp_sign@v13
        with:
          binary: in/build-secure_appv2/${{ needs.build.outputs.appv2-file }}

      - name: Create firmware package
        id: create_fwpkg
        uses: ci4rail/fw_esp-action/actions/create_firmware_package@v13
        with:
          output-file-suffix: "-${{ matrix.env.name }}"
          app-binary: ${{ steps.sign.outputs.signed-binary-path }}
          project-name: ${{ needs.build.outputs.project-name }}
          version: ${{ needs.build.outputs.version }}

      - name: Download bootloader
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ inputs.bootloader-repo }}
          tag: ${{ inputs.bootloader-release-tag }}
          token: ${{ secrets.access-token }}
          fileName: "*"
          out-file-path: in/build-secure/

      - name: Build Merged Factory binary
        uses: ci4rail/fw_esp-action/actions/factory_image@v13
        with:
          chip: ${{ needs.build.outputs.chip }}
          build-dir: in/build-secure/
          app-file: ${{ steps.sign.outputs.signed-binary-file }}
          bootloader-file-pattern: "*bootloader*-${{ matrix.env.name }}.bin"
          output-file: ${{ needs.build.outputs.project-name }}-${{ needs.build.outputs.version }}-${{ matrix.env.name }}-factory.bin

      - name: Stage firmware packages for artifact storage
        shell: bash
        run: |
          mkdir -p artifact
          cp -- "${{ steps.create_fwpkg.outputs.fwpkg }}" artifact/
          cp -a -- in/build-secure artifact/

          if [[ "${{ inputs.build-appv2 }}" == "true" && "${{ matrix.env.name }}" == "staging" ]]; then
            cp -a -- in/build-secure_appv2 artifact/
          fi

      - name: Upload firmware packages to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: fwpkg-${{ matrix.env.name }}
          path: artifact/
          retention-days: 2

      - name: tear down devcontainer
        if: ${{ always() }}
        uses: ci4rail/fw_esp-action/actions/teardown_devcontainer@v13

  test-staging:
    if: inputs.teststation-broker != ''
    needs: [build, sign]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Execute Test on Test station
        uses: ci4rail/fw_esp-action/actions/test@v13
        id: test
        with:
          teststation-broker: ${{ inputs.teststation-broker }}
          teststation-master-topic: ${{ inputs.teststation-master-topic }}
          teststation-request-timeout: ${{ inputs.teststation-request-timeout }}
          access-token: ${{ secrets.access-token }}
          artifact-name: fwpkg-staging
          test-environment: ${{ inputs.test-environment }}

  release:
    needs: [build, sign, test-staging]
    if: ${{ always() && (github.ref_type == 'tag') && (needs.test-staging.result == 'success' || needs.test-staging.result == 'skipped') && (needs.build.result == 'success') && (needs.sign.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # we need to checkout the repo to generate the release notes for the public repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.access-token }}

      - name: Download firmware packages
        uses: actions/download-artifact@v5
        with:
          pattern: fwpkg-*
          path: ./fwpkg
          merge-multiple: true

      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: build_output
          path: ./build-artifacts

      - shell: bash
        run: |
          ls -l fwpkg
          ls -l build-artifacts

      - name: Create Release in this Repo
        uses: ci4rail/fw_esp-action/actions/release@v13
        with:
          target_commitish: ${{ inputs.target-commitish }}
          assets: |
            fwpkg/*
            fwpkg/build-secure/*factory.bin
            build-artifacts/${{ needs.build.outputs.licensing-info }}

      - name: Create Release in Public Repo
        if: ${{ inputs.public-release-repo != '' }}
        uses: ci4rail/fw_esp-action/actions/release_public@v13
        with:
          public-repo: ${{ inputs.public-release-repo }}
          assets: |
            fwpkg/*production*.fwpkg
            build-artifacts/${{ needs.build.outputs.licensing-info }}
          access-token: ${{ secrets.access-token }}

  publish-sbom:
    needs: [build, release]
    if: ${{ always() && inputs.publish-sbom == true && github.ref_type == 'tag' && needs.release.result == 'success' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v5
        with:
          name: build_output
          path: ./build-artifacts

      - name: Publish SBOM to Dependency-Track
        uses: ci4rail/fw_esp-action/actions/dependency_track@v13
        with:
          sbom-file: build-artifacts/sbom.cdx.json
          url: ${{ vars.DEPENDENCY_TRACK_URL }}
          api-key: ${{ secrets.dependency-track-api-key }}
          project-name: ${{ needs.build.outputs.project-name }}
          project-version: ${{ github.ref_name }}
          classifier: ${{ inputs.dependency-track-classifier }}

      - name: Upload Dependency-Track reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-track-${{ github.run_id }}
          path: |
            build-artifacts/sbom.cdx.json
            dtrack-bom-response.json
            dtrack-audit-report.json
          if-no-files-found: warn
